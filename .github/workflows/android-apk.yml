# Android APK 빌드.
# GitHub 러너에 설치된 Android SDK로 네이티브 프로젝트를 생성(expo prebuild)하고
# release APK를 빌드해 Actions 아티팩트와 GitHub Releases(프리릴리스)에 올린다.
# release 빌드는 Expo 템플릿 기본값대로 debug 키로 서명되므로 스토어 배포용은 아니다.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/mock-stock-game-prd-tmxczu]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test -- --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # 대부분의 실기기(arm64)만 대상으로 빌드 시간을 줄인다.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist-apk/stock-simulator-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: stock-simulator-apk
          path: dist-apk/*.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK 빌드 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            `${{ github.ref_name }}` 브랜치 ${{ github.sha }} 커밋에서 자동 빌드한 테스트용 APK입니다 (arm64, debug 키 서명).
            폰에서 아래 APK를 내려받아 설치하세요. "출처를 알 수 없는 앱 설치" 허용이 필요합니다.
          files: dist-apk/*.apk
